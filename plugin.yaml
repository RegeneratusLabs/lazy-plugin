name: lazy-plugin
version: 0.2.1
description: >-
  Plugin creator. Describe a plugin in a sentence, or pick a skill the agent wrote or a cron job
  you already run, and it builds one: the model writes a spec (name, 1-5 tools, handler kinds,
  parameters), fixed templates write the code, and `hermes plugins validate` decides whether it
  ships. Handler bodies are limited to three safe shapes (command, http, file) plus an honest stub,
  so generated code always registers and never carries injected code. Writes only to
  $HERMES_HOME/lazy-plugin/created/ and never installs anything.
author: Josh Thomson
provides_tools:
  - lazyplugin_create
  - lazyplugin_sources
  - lazyplugin_built
  - lazyplugin_pending
