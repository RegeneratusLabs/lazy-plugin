name: lazy-plugin
version: 0.7.0
description: >-
  Build a Hermes plugin from a sentence, from a skill the agent wrote, or from a job that runs on a
  schedule — then prove it runs. Your own agent drafts the spec, fixed templates write the code, the
  catalog's validator gates it, and every tool is dispatched once through the real registry before
  anyone installs anything: works, needs a key, blocked upstream, half-built or broken, with the
  exact failing line. Four safe handler shapes (command, http, file, stub), so generated code always
  registers and cannot carry injected logic. Writes only to $HERMES_HOME/lazy-plugin/created/ and
  never installs by itself; publishing is a SHA-pinned catalog PR you send yourself.
author: Josh Thomson
provides_tools:
  - lazyplugin_create
  - lazyplugin_sources
  - lazyplugin_built
