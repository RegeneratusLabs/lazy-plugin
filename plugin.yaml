name: pluginscout
version: 0.1.0
description: >-
  Capability-gap instrument. Records what the agent tried and could not do (command-not-found,
  tool errors, repeated shell-outs, new skills written to cope) and reports which skills in this
  profile overlap a plugin that already exists in the public Hermes catalog. Read-only on the
  skills directory, never installs anything, no LLM in the matching path. Network: one GET of the
  published catalog JSON, cached 24h. Writes only to $HERMES_HOME/pluginscout/.
author: Josh Thomson
provides_tools:
  - pluginscout_report
  - pluginscout_refresh
  - pluginscout_explain
  - pluginscout_backfill
  - pluginscout_recommend
provides_hooks:
  - post_tool_call
  - on_skill_lifecycle
  - on_session_end
