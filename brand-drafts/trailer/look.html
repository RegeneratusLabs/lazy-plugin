<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lazy Plugin — look lock</title>
<style>
  @font-face { font-family: "Fell"; src: url("assets/font/IMFeENrm28P.ttf"); }
  @font-face { font-family: "Fell"; font-style: italic; src: url("assets/font/IMFeENit28P.ttf"); }
  @font-face { font-family: "FellSC"; src: url("assets/font/IMFeENsc28P.ttf"); }
  @font-face { font-family: "Mono"; src: url("assets/font/JetBrainsMono-var.ttf"); font-weight: 100 800; }

  :root{
    --ground:#150A2A;
    --ink:#D5BEE6;
    --paper:#F2E8F7;
    --muted:#A489BB;
    --accent:#B48CD9;
    --rule:rgba(213,190,230,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--ground);}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--ground);
         color:var(--ink);-webkit-font-smoothing:antialiased;}

  /* ── the plate, under-lit: it is the ground, not the subject ── */
  .plate{position:absolute;inset:0;overflow:hidden;}
  .plate img{position:absolute;left:50%;top:50%;width:2160px;height:2160px;
             transform:translate(-50%,-50%) translateY(-150px);
             filter:brightness(.52) contrast(1.12) saturate(.92);}
  .scrim{position:absolute;inset:0;background:
      linear-gradient(180deg, rgba(12,5,24,.94) 0%, rgba(12,5,24,.80) 150px, rgba(12,5,24,.28) 330px, rgba(12,5,24,.18) 60%, rgba(12,5,24,.86) 100%),
      radial-gradient(46% 58% at 50% 55%, rgba(10,4,20,.86) 0%, rgba(10,4,20,.55) 62%, rgba(10,4,20,0) 100%);}
  .screen{position:absolute;inset:0;pointer-events:none;
    background-image:repeating-linear-gradient(0deg, rgba(213,190,230,.05) 0 1px, transparent 1px 4px);
    mix-blend-mode:overlay;}
  .grain{position:absolute;inset:-10%;pointer-events:none;opacity:.34;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23n)' opacity='.5'/></svg>");
    mix-blend-mode:overlay;}

  /* ── sunburst: hairlines in the margins only ── */
  .burst{position:absolute;left:50%;top:-340px;width:1700px;height:1700px;transform:translateX(-50%);
         opacity:.13;pointer-events:none;}

  /* ── the frame ── */
  .frame{position:absolute;inset:38px;border:1px solid var(--rule);}
  .frame::after{content:"";position:absolute;inset:6px;border:1px solid rgba(213,190,230,.12);}
  .corner{position:absolute;width:280px;height:280px;opacity:.5;filter:brightness(.9) contrast(1.15);}
  .corner.tl{left:-6px;top:-6px;  -webkit-mask-image:radial-gradient(circle at 4% 4%,#000 22%,transparent 64%);}
  .corner.tr{right:-6px;top:-6px; -webkit-mask-image:radial-gradient(circle at 96% 4%,#000 22%,transparent 64%);}
  .corner.bl{left:-6px;bottom:-6px;-webkit-mask-image:radial-gradient(circle at 4% 96%,#000 22%,transparent 64%);}
  .corner.br{right:-6px;bottom:-6px;-webkit-mask-image:radial-gradient(circle at 96% 96%,#000 22%,transparent 64%);}

  /* ── masthead ── */
  .masthead{position:absolute;left:104px;top:80px;right:104px;display:flex;align-items:flex-start;
            justify-content:space-between;text-shadow:0 0 26px rgba(8,3,18,.95), 0 0 6px rgba(8,3,18,.85);}
  .wordmark{font-family:FellSC;font-size:64px;letter-spacing:.20em;line-height:1;color:var(--paper);}
  .thesis{font-family:Fell;font-style:italic;font-size:28px;line-height:1.3;color:var(--ink);
          margin-top:14px;opacity:.96;}
  .rule{position:absolute;left:104px;top:216px;right:104px;height:1px;background:rgba(213,190,230,.22);}
  .meta{font-family:Mono;font-size:12.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
        text-align:right;line-height:2;white-space:nowrap;}

  /* ── the product: the one lit object in the plate ── */
  .pane{position:absolute;left:404px;top:258px;width:1112px;height:742px;
        background:#100A1D;
        border:1px solid rgba(213,190,230,.42);
        box-shadow:0 0 0 5px rgba(12,5,24,.55), 0 0 0 6px rgba(213,190,230,.10),
                   0 34px 120px rgba(0,0,0,.75), 0 0 160px rgba(180,140,217,.13);}
  .pane img{display:block;width:1112px;height:742px;filter:contrast(1.03) brightness(1.06) saturate(1.02);}

  /* plate-mark around the window, and the shadow it casts on the plate */
  .aperture{position:absolute;left:392px;top:246px;width:1136px;height:766px;
            border:1px solid rgba(213,190,230,.16);}
  .aperture i{position:absolute;width:14px;height:14px;border:1px solid rgba(213,190,230,.55);}
  .aperture i:nth-child(1){left:-8px;top:-8px;border-right:0;border-bottom:0}
  .aperture i:nth-child(2){right:-8px;top:-8px;border-left:0;border-bottom:0}
  .aperture i:nth-child(3){left:-8px;bottom:-8px;border-right:0;border-top:0}
  .aperture i:nth-child(4){right:-8px;bottom:-8px;border-left:0;border-top:0}
</style>
</head>
<body>
<div id="stage">
  <div class="plate"><img src="assets/cat-laptop.jpg" alt=""></div>
  <div class="scrim"></div>
  <div class="screen"></div>

  <svg class="burst" viewBox="0 0 1700 1700" fill="none"><g stroke="#B48CD9" stroke-width="1"></g></svg>

  <div class="frame">
    <img class="corner tl" src="assets/corner-tl.png" alt="">
    <img class="corner tr" src="assets/corner-tr.png" alt="">
    <img class="corner bl" src="assets/corner-bl.png" alt="">
    <img class="corner br" src="assets/corner-br.png" alt="">
  </div>

  <div class="masthead">
    <div>
      <div class="wordmark">LAZY PLUGIN</div>
      <div class="thesis">a plugin is an idea, a check, and one real try-out before it ships</div>
    </div>
    <div class="meta">Hermes Desktop &nbsp;·&nbsp; lp-19<br>4 plugins &nbsp;·&nbsp; 5 tools<br>2 purring &nbsp;·&nbsp; 1 needs a key<br>MIT</div>
  </div>

  <div class="rule"></div>
  <div class="aperture"><i></i><i></i><i></i><i></i></div>
  <div class="pane"><img src="assets/ui/pane.png" alt=""></div>

  <div class="grain"></div>
</div>

<script>
  const g = document.querySelector('.burst g');
  const NS = 'http://www.w3.org/2000/svg';
  for (let i = 0; i < 128; i++) {
    const a = (i / 128) * Math.PI * 2;
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', 850 + Math.cos(a) * 150);
    l.setAttribute('y1', 850 + Math.sin(a) * 150);
    l.setAttribute('x2', 850 + Math.cos(a) * 850);
    l.setAttribute('y2', 850 + Math.sin(a) * 850);
    l.setAttribute('opacity', i % 2 ? 0.45 : 1);
    g.appendChild(l);
  }
</script>
</body>
</html>
